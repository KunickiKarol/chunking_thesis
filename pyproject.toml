[tool.black]
line-length = 120
target-version = ['py310']  # wersja Pythona, dostosuj do swojego środowiska
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | build
  | dist
  | __pycache__
  | downloads
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["chunking", "download_datasets"]  # Twoje foldery z kodem
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv", "build", "dist", "__pycache__", "downloads"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]  # zgodne z Black
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "downloads"
]