presets:
  - name: nemotron_9b
    params:
      inference_mode: hf
      model: nvidia/NVIDIA-Nemotron-Nano-9B-v2
      token_limit: 8192
      max_new_tokens: 512
      prompt_template: default_prompt
      tokenizer_backend: tiktoken
      tokenizer_model_name: gpt-4
  - name: deepseek_1_5b
    params:
      inference_mode: hf  
      model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
      token_limit: 8192
      max_new_tokens: 512
      prompt_template: default_prompt
      tokenizer_backend: tiktoken
      tokenizer_model_name: gpt-4

