stages:
  download:
    cmd: python -m src.download_datasets.download_datasets_all --datasets_download ${datasets_download}
    deps:
      - src/download_datasets/download_datasets_all.py
      - params.yaml
    outs:
      - data/downloads/:
          persist: true
    params:
      - datasets_download

  preprocess_datasets:
    cmd: python -m src.preprocess_datasets.preprocess_datasets_all --datasets ${preprocess_datasets.datasets}
    deps:
      - data/downloads/
      - src/preprocess_datasets/preprocess_datasets_all.py
      - params.yaml
    outs:
      - data/datasets/:
          persist: true
    params:
      - preprocess_datasets.datasets

  chunking_text:
    cmd:
      python -m src.chunking.chunking_text_all
      --datasets '${preprocess_datasets.datasets}'
      --chunking_methods '${chunking.methods}'
    deps:
      - data/datasets/
      - src/chunking/chunking_text_all.py
      - params.yaml
    outs:
      - data/chunks/:
          persist: true
    params:
      - preprocess_datasets.datasets
      - chunking.methods

  embed_chunks:
    cmd: python -m src.embed_chunks.embed_chunks_all \
        --datasets '${preprocess_datasets.datasets}' \
        --chunking_types '${chunking.methods}' \
        --embed_methods '${vector_embed.methods}'
    deps:
      - data/chunks/
      - src/embed_chunks/embed_chunks_all.py
      - params.yaml
    outs:
      - data/vector_db/:
          persist: true
    params:
      - preprocess_datasets.datasets
      - chunking.methods
      - vector_embed.methods

  search:
    cmd: python -m src.search.search_all --datasets ${datasets} --chunking_types ${chunking.chunking_types} --embed_chunks_types ${vector_embed.embed_chunks_types} --vector_db ${vector_embed.vector_db} --top_k ${search.top_k}
    deps:
      - data/vector_db/
      - src/search/search_query.py
    params:
      - datasets
      - chunking.chunking_types
      - vector_embed.embed_chunks_types
      - vector_embed.vector_db

