stages:
  download:
    cmd: python -m download_datasets.download_datasets_all --datasets ${datasets}
    deps:
      - download_datasets/download_datasets_all.py
      - params.yaml
    outs:
      - downloads/
    params:
      - datasets

  preprocess_datasets:
    cmd: python -m preprocess_datasets.preprocess_datasets_all --datasets ${datasets}
    deps:
      - downloads/
      - preprocess_datasets/preprocess_datasets_all.py
    outs:
      - datasets/
    params:
      - datasets

  chunking_text:
    cmd: python -m chunking.chunking_text_all --datasets ${datasets} --chunking ${chunking.chunking_types}
    deps:
      - datasets/
      - chunking/chunking_text_all.py
    outs:
      - chunks/
    params:
      - datasets
      - chunking
